<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>قائمة مهامي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13; --surface: #1a1a22; --surface2: #22222e;
      --accent: #f5c842; --accent2: #e8a020;
      --text: #f0ede6; --text-muted: #7a7890;
      --done-color: #3a3a4a; --radius: 14px;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 40px 16px 80px;
    }
    header { text-align: center; margin-bottom: 36px; animation: fadeDown 0.6s ease both; }
    header h1 { font-size: 2.4rem; font-weight: 800; color: var(--accent); }
    header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 6px; }

    .stats { display: flex; gap: 16px; margin-bottom: 24px; animation: fadeDown 0.6s 0.1s ease both; }
    .stat { background: var(--surface); border-radius: var(--radius); padding: 12px 20px; text-align: center; flex: 1; }
    .stat-num { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    .container { width: 100%; max-width: 560px; }

    .input-area { display: flex; gap: 10px; margin-bottom: 20px; animation: fadeDown 0.6s 0.15s ease both; }
    .input-area input {
      flex: 1; background: var(--surface); border: 2px solid transparent;
      border-radius: var(--radius); padding: 14px 18px;
      font-family: 'Tajawal', sans-serif; font-size: 1rem; color: var(--text);
      outline: none; transition: border-color 0.2s;
    }
    .input-area input::placeholder { color: var(--text-muted); }
    .input-area input:focus { border-color: var(--accent); }
    .btn-add {
      background: var(--accent); color: #111; border: none;
      border-radius: var(--radius); padding: 14px 22px;
      font-family: 'Tajawal', sans-serif; font-size: 1rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: background 0.2s, transform 0.1s;
    }
    .btn-add:hover { background: var(--accent2); }
    .btn-add:active { transform: scale(0.97); }

    .filters { display: flex; gap: 8px; margin-bottom: 16px; animation: fadeDown 0.6s 0.2s ease both; }
    .filter-btn {
      background: var(--surface); border: 2px solid transparent;
      border-radius: 30px; padding: 7px 18px;
      font-family: 'Tajawal', sans-serif; font-size: 0.88rem;
      color: var(--text-muted); cursor: pointer; transition: all 0.2s;
    }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); font-weight: 700; }

    #task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .task-item {
      background: var(--surface); border-radius: var(--radius);
      padding: 16px 18px; display: flex; align-items: center; gap: 14px;
      transition: background 0.2s, opacity 0.3s;
      animation: slideIn 0.3s ease both; position: relative; overflow: hidden;
    }
    .task-item::before {
      content: ''; position: absolute; right: 0; top: 0; bottom: 0;
      width: 4px; background: var(--accent); border-radius: 0 var(--radius) var(--radius) 0;
      transition: background 0.3s;
    }
    .task-item.done { background: var(--done-color); opacity: 0.7; }
    .task-item.done::before { background: var(--text-muted); }

    .check-wrap { position: relative; flex-shrink: 0; }
    .check-wrap input[type="checkbox"] { display: none; }
    .check-wrap label {
      width: 24px; height: 24px; border: 2px solid var(--text-muted);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: border-color 0.2s, background 0.2s;
    }
    .check-wrap input:checked + label { background: var(--accent); border-color: var(--accent); }
    .check-wrap label::after { content: '✓'; color: #111; font-size: 13px; font-weight: 800; opacity: 0; transition: opacity 0.2s; }
    .check-wrap input:checked + label::after { opacity: 1; }

    .task-text { flex: 1; font-size: 1rem; transition: color 0.2s; }
    .task-item.done .task-text { text-decoration: line-through; color: var(--text-muted); }

    .btn-delete {
      background: none; border: none; color: var(--text-muted);
      font-size: 1.1rem; cursor: pointer; padding: 4px 8px;
      border-radius: 8px; transition: color 0.2s, background 0.2s; flex-shrink: 0;
    }
    .btn-delete:hover { color: #e05555; background: rgba(224,85,85,0.1); }

    .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); display: none; }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }

    .bottom-bar { margin-top: 20px; display: flex; justify-content: flex-end; }
    .btn-clear {
      background: none; border: none; color: var(--text-muted);
      font-family: 'Tajawal', sans-serif; font-size: 0.88rem;
      cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: color 0.2s, background 0.2s;
    }
    .btn-clear:hover { color: #e05555; background: rgba(224,85,85,0.1); }

    /* رسالة الحالة */
    .status {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); color: var(--text); padding: 10px 22px;
      border-radius: 30px; font-size: 0.9rem; opacity: 0;
      transition: opacity 0.3s; pointer-events: none; border: 1px solid var(--accent);
    }
    .status.show { opacity: 1; }

    @keyframes fadeDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
  </style>
</head>
<body>

<header>
  <h1>📋 مهامي</h1>
  <p>مرتبط بالسيرفر — بياناتك تُحفظ في الملف</p>
</header>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">إجمالي</div></div>
    <div class="stat"><div class="stat-num" id="stat-pending">0</div><div class="stat-label">متبقية</div></div>
    <div class="stat"><div class="stat-num" id="stat-done">0</div><div class="stat-label">مكتملة</div></div>
  </div>

  <div class="input-area">
    <input type="text" id="task-input" placeholder="اكتب مهمتك هنا..." maxlength="120"/>
    <button class="btn-add" onclick="addTask()">+ أضف</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter(this)">الكل</button>
    <button class="filter-btn" data-filter="pending" onclick="setFilter(this)">المتبقية</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter(this)">المكتملة</button>
  </div>

  <ul id="task-list"></ul>
  <div class="empty" id="empty-state"><div class="empty-icon">🎯</div><p>لا توجد مهام هنا</p></div>

  <div class="bottom-bar">
    <button class="btn-clear" onclick="clearDone()">🗑 حذف المكتملة</button>
  </div>
</div>

<div class="status" id="status-msg"></div>

<script>
  // ==============================
  // عنوان الباك اند (السيرفر)
  // ==============================
  const API = 'http://localhost:3000';

  let tasks = [];
  let currentFilter = 'all';

  // --- عرض رسالة حالة ---
  function showStatus(msg) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  // --- جلب المهام من السيرفر ---
  async function loadTasks() {
    try {
      const res = await fetch(`${API}/tasks`);   // GET /tasks
      tasks = await res.json();
      renderTasks();
    } catch {
      showStatus('⚠️ تأكد أن السيرفر يشتغل');
    }
  }

  // --- إضافة مهمة ---
  async function addTask() {
    const input = document.getElementById('task-input');
    const text  = input.value.trim();
    if (!text) return;

    const res  = await fetch(`${API}/tasks`, {   // POST /tasks
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const newTask = await res.json();
    tasks.push(newTask);
    input.value = '';
    renderTasks();
    showStatus('✅ تمت الإضافة');
    input.focus();
  }

  // --- تأشير مهمة مكتملة ---
  async function toggleTask(id) {
    const res  = await fetch(`${API}/tasks/${id}`, { method: 'PUT' }); // PUT /tasks/:id
    const updated = await res.json();
    const task = tasks.find(t => t._id === id);
    if (task) task.done = updated.done;
    renderTasks();
  }

  // --- حذف مهمة ---
  async function deleteTask(id) {
    await fetch(`${API}/tasks/${id}`, { method: 'DELETE' }); // DELETE /tasks/:id
    tasks = tasks.filter(t => t._id !== id);
    renderTasks();
    showStatus('🗑 تم الحذف');
  }

  // --- حذف المكتملة ---
  async function clearDone() {
    const doneTasks = tasks.filter(t => t.done);
    for (const t of doneTasks) {
      await fetch(`${API}/tasks/${t._id}`, { method: 'DELETE' });
    }
    tasks = tasks.filter(t => !t.done);
    renderTasks();
    showStatus('🗑 تم حذف المكتملة');
  }

  // --- فلتر ---
  function setFilter(btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTasks();
  }

  // --- رسم المهام ---
  function renderTasks() {
    const list = document.getElementById('task-list');
    const emptyState = document.getElementById('empty-state');

    let filtered = tasks;
    if (currentFilter === 'pending') filtered = tasks.filter(t => !t.done);
    if (currentFilter === 'done')    filtered = tasks.filter(t =>  t.done);

    list.innerHTML = '';
    emptyState.style.display = filtered.length === 0 ? 'block' : 'none';

    filtered.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');
      li.innerHTML = `
        <div class="check-wrap">
          <input type="checkbox" id="cb-${task._id}" ${task.done ? 'checked' : ''} onchange="toggleTask(${task._id})"/>
          <label for="cb-${task._id}"></label>
        </div>
        <span class="task-text">${escapeHtml(task.text)}</span>
        <button class="btn-delete" onclick="deleteTask(${task._id})">✕</button>
      `;
      list.appendChild(li);
    });

    document.getElementById('stat-total').textContent   = tasks.length;
    document.getElementById('stat-pending').textContent = tasks.filter(t => !t.done).length;
    document.getElementById('stat-done').textContent    = tasks.filter(t =>  t.done).length;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // --- ابدأ ---
  loadTasks();
</script>
</body>
</html>
